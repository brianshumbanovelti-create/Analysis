  }

  function handleRowClick(e) {
    var row = e.target.closest(".driver-row"); if (!row) return;
    var dn = parseInt(row.getAttribute("data-dn"), 10), now = Date.now();
    if (now - lastTapTime < 300 && lastTapTarget === dn) { 
      toggleHighlight(dn); 
      openModal(dn);
      lastTapTime = 0; 
    }
    else { lastTapTime = now; lastTapTarget = dn; }
  }

  els.rankingsList.addEventListener("click", handleRowClick);
  if (els.overlayRankingsList) els.overlayRankingsList.addEventListener("click", handleRowClick);

  function handleCanvasClick(e) {
    if (!state.transform || els.mapEmpty.style.display !== "none") return;
    var rect = els.canvas.getBoundingClientRect(), tx = e.clientX - rect.left, ty = e.clientY - rect.top;
    
    var hitDn = null;
    var t = state.transform;
    for (var i = Object.keys(state.drivers).length - 1; i >= 0; i--) {
      var dn = Object.keys(state.drivers)[i], loc = getCarLocation(state.drivers[dn].data, state.currentTime);
      if (!loc || (state._stuck[dn] && state._stuck[dn].v)) continue;
      var pc = t.project(loc[0], loc[1]), cx = pc[0], cy = pc[1];
      
      if (Math.sqrt(Math.pow(tx - cx, 2) + Math.pow(ty - cy, 2)) < 22) { hitDn = parseInt(dn, 10); break; }
    }
    
    if (hitDn) {
      var now = Date.now();
      if (now - lastTapTime < 300 && lastTapTarget === hitDn) { toggleHighlight(hitDn); lastTapTime = 0; }
      else { lastTapTime = now; lastTapTarget = hitDn; }
    }
  }

  els.canvas.addEventListener("click", handleCanvasClick);

  function prepareBackground() {
    if (!state.outline) return;
    var dpr = window.devicePixelRatio || 1, cssW = els.canvas.clientWidth, cssH = els.canvas.clientHeight;
    if (cssW === 0 || cssH === 0) return;
    els.canvas.width = Math.round(cssW * dpr); els.canvas.height = Math.round(cssH * dpr);
    baseCanvas.width = els.canvas.width; baseCanvas.height = els.canvas.height;
    baseCtx.setTransform(dpr, 0, 0, dpr, 0, 0); baseCtx.clearRect(0, 0, cssW, cssH);
    
    var pts = state.outline.points, minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    pts.forEach(p => { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); });
    var w = maxX - minX, h = maxY - minY;
    if (w <= 0 || h <= 0) return;

    // Fit and centre the track AFTER rotation (a 90/270 turn swaps its width and height)
    var rot = state.rotation, swap = (rot === 90 || rot === 270);
    var bw = swap ? h : w, bh = swap ? w : h;
    var pad = 16, availW = cssW - pad * 2, availH = cssH - pad * 2;
    var scale = Math.min(availW / bw, availH / bh);
    var ox = (cssW - bw * scale) / 2, oy = (cssH - bh * scale) / 2;
    function toCanvas(px, py) {
      var lx = (px - minX) * scale, ly = (py - minY) * scale, rx, ry;
      if (rot === 90) { rx = h * scale - ly; ry = lx; }
      else if (rot === 180) { rx = w * scale - lx; ry = h * scale - ly; }
      else if (rot === 270) { rx = ly; ry = w * scale - lx; }
      else { rx = lx; ry = ly; }
      var cx = ox + rx, cy = oy + ry;
      if (state.flipX) cx = cssW - cx;
      return [cx, cy];
    }
    state.transform = { minX, minY, scale, cssW, cssH, project: toCanvas, mid: toCanvas(minX + w / 2, minY + h / 2) };

    var trackStatus = getTrackStatus(state.currentTime);
    var strokeColor = trackStatus === "Red" ? "#ff5c5c" : trackStatus === "SC" ? "var(--yellow)" : trackStatus === "VSC" ? "var(--amber)" : "#2a3454";

    baseCtx.beginPath();
    var p0 = toCanvas(pts[0][0], pts[0][1]); baseCtx.moveTo(p0[0], p0[1]);
    for (var j = 1; j < pts.length; j++) { var c = toCanvas(pts[j][0], pts[j][1]); baseCtx.lineTo(c[0], c[1]); }
    baseCtx.closePath();
    baseCtx.lineWidth = 4; baseCtx.lineJoin = "round";
    baseCtx.strokeStyle = strokeColor;
    baseCtx.stroke();

    var p1 = toCanvas(pts[1][0], pts[1][1]);
    var dx = p1[0] - p0[0], dy = p1[1] - p0[1], len = Math.sqrt(dx*dx + dy*dy);
    var nx = -dy / len, ny = dx / len, lineLen = 12;
    baseCtx.beginPath(); baseCtx.moveTo(p0[0] - nx * lineLen, p0[1] - ny * lineLen);
    baseCtx.lineTo(p0[0] + nx * lineLen, p0[1] + ny * lineLen);
    baseCtx.lineWidth = 3; baseCtx.strokeStyle = "#ffffff"; baseCtx.stroke();

    var validLaps = state.laps.filter(l => l.date_start && !l.is_pit_out_lap && l.duration_sector_1 && l.duration_sector_2 && l.duration_sector_3);
    if (validLaps.length > 0) {
      var fastest = validLaps.reduce((a, b) => a.lap_duration < b.lap_duration ? a : b);
      var startMs = new Date(fastest.date_start).getTime();
      var s1Ms = startMs + (fastest.duration_sector_1 * 1000);
      var s2Ms = s1Ms + (fastest.duration_sector_2 * 1000);
      var refData = state.drivers[fastest.driver_number] ? state.drivers[fastest.driver_number].data : [];
      
      function findCoord(targetMs) {
        var targetT = (targetMs - state.sessionStartMs) / 1000;
        for (var i = 0; i < refData.length - 1; i++) {
          if (refData[i][0] <= targetT && refData[i+1][0] >= targetT) {
            var ratio = (targetT - refData[i][0]) / (refData[i+1][0] - refData[i][0]);
            return [refData[i][1] + (refData[i+1][1] - refData[i][1]) * ratio, refData[i][2] + (refData[i+1][2] - refData[i][2]) * ratio];
          }
        }
        return null;
      }
      
      [s1Ms, s2Ms].forEach(tgtMs => {
        var coord = findCoord(tgtMs);
        if (coord) {
          var c = toCanvas(coord[0], coord[1]);
          baseCtx.beginPath(); baseCtx.moveTo(c[0] - nx * 8, c[1] - ny * 8); baseCtx.lineTo(c[0] + nx * 8, c[1] + ny * 8);
          baseCtx.lineWidth = 2; baseCtx.strokeStyle = "rgba(255,255,255,0.4)"; baseCtx.stroke();
        }
      });
    }
  }

  // A car is "stuck" in a race once the leader is 3+ laps ahead of it AND it hasn't moved for the last minute.
  var STUCK_DIST = 80;   // location units (about 8 m)
  function isStuck(dn, lapsBehind) {
    if (state.sessionType !== "race" || lapsBehind < 3) return false;
    var t = state.currentTime, memo = state._stuck[dn];
    if (memo && t >= memo.t && t - memo.t < 1.5) return memo.v;
    var data = state.drivers[dn].data, now = getCarLocation(data, t), v = false;
    if (now) {
      v = true;
      for (var s = 10; s <= 60; s += 10) {
        var p = getCarLocation(data, t - s);
        if (p && Math.hypot(p[0] - now[0], p[1] - now[1]) > STUCK_DIST) { v = false; break; }
      }
    }
    state._stuck[dn] = { t: t, v: v };
    return v;
  }

  function drawCars() {
    if (!state.outline || !state.transform) return;
    var ctx = els.canvas.getContext("2d"), t = state.transform, dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, els.canvas.width, els.canvas.height);
    ctx.drawImage(baseCanvas, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    var maxLap = 0;
    state.laps.forEach(l => { if (state.currentTime >= l._t_end && l.lap_number > maxLap) maxLap = l.lap_number; });

    var podium = (state.order || []).slice(0, 3), hl = state.highlightedDriver, plain = [], tagged = [];
    for (var dn in state.drivers) {
      var car = state.drivers[dn], loc = getCarLocation(car.data, state.currentTime);
      if (!loc) continue;
      
      var dLaps = state.laps.filter(l => l.driver_number == dn && l._t_start !== null);
      var completed = dLaps.filter(l => state.currentTime >= l._t_end).length;
      if (isStuck(parseInt(dn, 10), maxLap - completed)) continue;   // stopped for 3+ laps: remove from the tracker
      
      var pc = t.project(loc[0], loc[1]);
      var c = { dn: parseInt(dn, 10), car: car, x: pc[0], y: pc[1] };
      if (c.dn === hl || podium.indexOf(c.dn) !== -1) tagged.push(c); else plain.push(c);
    }

    // Everyone is a small team-colour dot; the podium and the selected car also get a name tag
    plain.forEach(c => {
      ctx.beginPath(); ctx.arc(c.x, c.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = "#" + c.car.color; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = "#000"; ctx.stroke();
    });
    tagged.sort((a, b) => (a.dn === hl) - (b.dn === hl));   // selected car on top
    tagged.forEach(c => {
      var sel = c.dn === hl;
      ctx.beginPath(); ctx.arc(c.x, c.y, sel ? 8 : 6.5, 0, Math.PI * 2);
      ctx.fillStyle = "#" + c.car.color; ctx.fill();
      ctx.lineWidth = sel ? 2.2 : 1.5; ctx.strokeStyle = sel ? "#fff" : "#000"; ctx.stroke();
    });

    var placed = [];
    tagged.slice().reverse().forEach(c => {
      var sel = c.dn === hl, text = c.car.acronym;
      ctx.font = "bold 10.5px 'Noto Sans Mono', monospace";
      var bw = ctx.measureText(text).width + 14, bh = 18;
      var dx = c.x - t.mid[0], dy = c.y - t.mid[1], d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
      var dist = 26, lx = c.x, ly = c.y;
      for (var tries = 0; tries < 8; tries++) {
        lx = Math.max(bw / 2 + 2, Math.min(t.cssW - bw / 2 - 2, c.x + dx * dist));
        ly = Math.max(bh / 2 + 2, Math.min(t.cssH - bh / 2 - 2, c.y + dy * dist));
        if (!placed.some(p => Math.abs(p.x - lx) < (p.w + bw) / 2 + 2 && Math.abs(p.y - ly) < (p.h + bh) / 2 + 2)) break;
        dist += 14;
      }
      placed.push({ x: lx, y: ly, w: bw, h: bh });
      ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(lx, ly); ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.stroke();
      ctx.beginPath(); tgRoundRect(ctx, lx - bw / 2, ly - bh / 2, bw, bh, 9);
      ctx.fillStyle = sel ? "#eef1f8" : "rgba(0,0,0,.85)"; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,.2)"; ctx.stroke();
      ctx.fillStyle = sel ? "#000" : "#eef1f8"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(text, lx, ly + 1);
    });
  }

  function getCarLocation(data, t) {
    if (data.length === 0) return null;
    if (t > data[data.length - 1][0]) {
      var last = data[data.length - 1];
      return (last[1] === 0 && last[2] === 0) ? null : [last[1], last[2]];
    }
    if (t < data[0][0]) return null;

    var i = data.length - 1;
    while (i > 0 && data[i][0] > t) i--;
    if (i === data.length - 1) return [data[i][1], data[i][2]];
    
    var p1 = data[i], p2 = data[i + 1];
    if (p2[0] - p1[0] > 15) return [p1[1], p1[2]]; // Increased tolerance for pit stops

    var ratio = (t - p1[0]) / (p2[0] - p1[0]);
    var x = p1[1] + (p2[1] - p1[1]) * ratio, y = p1[2] + (p2[2] - p1[2]) * ratio;
    if (x === 0 && y === 0) return null;
    return [x, y];
  }

  function getTrackPosition(x, y) {
    if (!state.outline || !state.outline.points[0][2]) return { dist: 9999, t: 0 };
    var pts = state.outline.points;
    var minDist = Infinity, bestT = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var x1 = pts[i][0], y1 = pts[i][1], t1 = pts[i][2];
      var x2 = pts[i+1][0], y2 = pts[i+1][1], t2 = pts[i+1][2];
      
      var dx = x2 - x1, dy = y2 - y1;
      var lenSq = dx*dx + dy*dy;
      if (lenSq === 0) continue;
      
      var u = ((x - x1) * dx + (y - y1) * dy) / lenSq;
      u = Math.max(0, Math.min(1, u));
      
      var px = x1 + u * dx, py = y1 + u * dy;
      var dist = Math.sqrt(Math.pow(x - px, 2) + Math.pow(y - py, 2));
      
      if (dist < minDist) {
        minDist = dist;
        bestT = t1 + u * (t2 - t1);
      }
    }
    return { dist: minDist, t: bestT };
  }

  function loop(timestamp) {
    if (!state.playing) return;
    if (!state.lastFrameTime) state.lastFrameTime = timestamp;
    var dt = (timestamp - state.lastFrameTime) / 1000; state.lastFrameTime = timestamp; state.currentTime += dt * state.speed;
    if (state.currentTime >= state.sessionLength) { state.currentTime = state.sessionLength; pausePlayback(); }
    
    updateTimeDisplay();
    var currentFlagState = getTrackStatus(state.currentTime);
    if (state.lastFlagState !== currentFlagState) {
      state.lastFlagState = currentFlagState;
      prepareBackground();
    }
    drawCars(); updateRankings();
    
    if (els.driverModal.classList.contains('open')) renderModalBody();
    if (document.getElementById('trackGapsOverlay').classList.contains('open')) renderTrackGaps();
    
    if (state.playing) animationId = requestAnimationFrame(loop);
  }
  
  function playPlayback() { 
    if (state.playing) return; 
    if (state.currentTime >= state.sessionLength) state.currentTime = 0; 
    state.playing = true; 
    state.lastFrameTime = 0; 
    els.playBtn.textContent = "⏸"; 
    animationId = requestAnimationFrame(loop); 
  }
  
  function pausePlayback() { 
    state.playing = false; 
    els.playBtn.textContent = "▶"; 
    if (animationId) cancelAnimationFrame(animationId); 
  }
  
  els.playBtn.addEventListener("click", () => { if (state.playing) pausePlayback(); else playPlayback(); });

    state.currentTime = parseFloat(els.slider.value);
    updateTimeDisplay();
    var currentFlagState = getTrackStatus(state.currentTime);

  els.slider.addEventListener("touchend", () => { if (wasPlaying) playPlayback(); });
  
  els.flipBtn.addEventListener("click", () => {

  els.rcBtn.addEventListener("click", window.openRCOverlay);

  window.addEventListener("orientationchange", () => { if (resizeTimer) clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { prepareBackground(); drawCars(); renderTrackGaps(); }, 100); });

  // --- ANALYSIS TAB LOGIC ---
  function initAnalysis() {
    var d1 = document.getElementById("analysisDriver1");
    var d2 = document.getElementById("analysisDriver2");
    if (!d1 || !d2) return; 

    var opts = state.driverOrder.map(d => `<option value="${d.driver_number}">${state.drivers[d.driver_number].acronym}</option>`).join("");
    d1.innerHTML = opts;
    d2.innerHTML = opts;
    if (state.driverOrder.length > 1) d2.selectedIndex = 1;
    
    d1.onchange = renderAnalysis;
    d2.onchange = renderAnalysis;
    state.expandedAnalysisLap = null;

  }

  window.toggleAnalysisLap = function(lapNum) {
    if (state.expandedAnalysisLap === lapNum) state.expandedAnalysisLap = null;
    else state.expandedAnalysisLap = lapNum;
    renderAnalysis();
  };

  function renderAnalysis() {
    var dn1 = parseInt(document.getElementById("analysisDriver1").value);
    var dn2 = parseInt(document.getElementById("analysisDriver2").value);
    if (!dn1 || !dn2 || dn1 === dn2) {
      document.getElementById("analysisResults").innerHTML = `<div style="text-align:center; padding:20px; color:#888">Select two different drivers.</div>`;
      return;
    }

    var currentT = state.currentTime;
    var laps1 = state.laps.filter(l => l.driver_number === dn1 && l.lap_duration && l._t_end <= currentT).sort((a,b) => a.lap_number - b.lap_number);
    var laps2 = state.laps.filter(l => l.driver_number === dn2 && l.lap_duration && l._t_end <= currentT).sort((a,b) => a.lap_number - b.lap_number);
    
    var maxLap = Math.max(laps1.length > 0 ? laps1[laps1.length-1].lap_number : 0, laps2.length > 0 ? laps2[laps2.length-1].lap_number : 0);
    
    var d1Color = "#" + state.drivers[dn1].color;
    var d2Color = "#" + state.drivers[dn2].color;
    
    document.getElementById("analysisSummary").innerHTML = `${state.drivers[dn1].acronym} vs ${state.drivers[dn2].acronym}`;

    var html = `<div class="analysis-header-row"><span>Lap</span><span>${state.drivers[dn1].acronym}</span><span>Gap</span><span>${state.drivers[dn2].acronym}</span></div>`;

    for (var i = 1; i <= maxLap; i++) {
      var l1 = laps1.find(l => l.lap_number === i);
      var l2 = laps2.find(l => l.lap_number === i);
      
      if (!l1 && !l2) continue;

      var t1Str = l1 ? formatTime(l1.lap_duration) : "-";
      var t2Str = l2 ? formatTime(l2.lap_duration) : "-";
      var t1Cls = l1 && l2 && l1.lap_duration <= l2.lap_duration ? "fastest" : "";
      var t2Cls = l2 && l1 && l2.lap_duration < l1.lap_duration ? "fastest" : "";

      var deltaStr = "";
      var deltaColor = "#fff";
      var d1Width = 0, d2Width = 0;
      var s1w = 0, s2w = 0, s3w = 0;
      
      if (l1 && l2) {
        var d = l1.lap_duration - l2.lap_duration;
        deltaStr = Math.abs(d).toFixed(2);
        deltaColor = d < 0 ? d1Color : d2Color;
        var maxD = 2.0;
        var pct = Math.min(1, Math.abs(d) / maxD) * 50;
        if (d < 0) d1Width = pct; else d2Width = pct;

        function sectorW(s1, s2) { if (!s1 || !s2) return 0; return Math.min(1, Math.abs(s1-s2)/0.5)*50; }
        s1w = sectorW(l1.duration_sector_1, l2.duration_sector_1);
        s2w = sectorW(l1.duration_sector_2, l2.duration_sector_2);
        s3w = sectorW(l1.duration_sector_3, l2.duration_sector_3);
      }

      html += `<div class="analysis-row" onclick="toggleAnalysisLap(${i})">
        <div class="analysis-top-line">
          <div class="analysis-time-wrap left">
            <span class="analysis-lap-num">${i}</span>
            <span class="analysis-time ${t1Cls}">${t1Str}</span>
          </div>
          <div class="analysis-center-bar">
            <div class="analysis-delta" style="color:${deltaColor}">${deltaStr}</div>
            <div class="analysis-track">
              <div class="analysis-tick"></div>
              <div style="position:absolute; right:50%; height:100%; background:${d1Color}; width:${d1Width}%"></div>
              <div style="position:absolute; left:50%; height:100%; background:${d2Color}; width:${d2Width}%"></div>
            </div>
          </div>
          <div class="analysis-time-wrap right">
            <span class="analysis-lap-num">&nbsp;</span>
            <span class="analysis-time ${t2Cls}">${t2Str}</span>
          </div>
        </div>
        <div class="analysis-sector-row">${[1, 2, 3].map(n => {
          var a = l1 && l1["duration_sector_" + n], b = l2 && l2["duration_sector_" + n];
          var c = (a && b) ? (a < b ? d1Color : (b < a ? d2Color : "#333")) : "#333";
          return `<div class="sector-seg" style="background:${c}"></div>`;
        }).join("")}</div>
      </div>`;

      if (l1 && l2) {
        function cS(s1, s2, c1, c2) { if(!s1||!s2) return ""; return s1<s2 ? "color:"+c1 : s2<s1 ? "color:"+c2 : ""; }
        html += `<div class="analysis-detail-row ${state.expandedAnalysisLap === i ? 'open' : ''}">
          <span>Lap ${i}</span>
          <span>${state.drivers[dn1].acronym} / ${state.drivers[dn2].acronym}</span>
          <span></span>
        </div>`;
        html += `<div class="analysis-detail-row ${state.expandedAnalysisLap === i ? 'open' : ''}">
          <span>S1</span>
          <span style="${cS(l1.duration_sector_1, l2.duration_sector_1, d1Color, d2Color)}">${l1.duration_sector_1?.toFixed(2)}</span>
          <span style="text-align:right; ${cS(l1.duration_sector_1, l2.duration_sector_1, d2Color, d1Color)}">${l2.duration_sector_1?.toFixed(2)}</span>
        </div>`;
        html += `<div class="analysis-detail-row ${state.expandedAnalysisLap === i ? 'open' : ''}">
          <span>S2</span>
          <span style="${cS(l1.duration_sector_2, l2.duration_sector_2, d1Color, d2Color)}">${l1.duration_sector_2?.toFixed(2)}</span>
          <span style="text-align:right; ${cS(l1.duration_sector_2, l2.duration_sector_2, d2Color, d1Color)}">${l2.duration_sector_2?.toFixed(2)}</span>
        </div>`;
        html += `<div class="analysis-detail-row ${state.expandedAnalysisLap === i ? 'open' : ''}">
          <span>S3</span>
          <span style="${cS(l1.duration_sector_3, l2.duration_sector_3, d1Color, d2Color)}">${l1.duration_sector_3?.toFixed(2)}</span>
          <span style="text-align:right; ${cS(l1.duration_sector_3, l2.duration_sector_3, d2Color, d1Color)}">${l2.duration_sector_3?.toFixed(2)}</span>
        </div>`;
      }
    }

    document.getElementById("analysisResults").innerHTML = html;
  }

  // --- TRACK GAPS (CIRCLE OF DOOM) ---
  function initTrackGaps() {
    var ids = Object.keys(state.drivers).sort((a, b) => state.drivers[a].acronym.localeCompare(state.drivers[b].acronym));
    if (!ids.length) return;
    if (!state.tgDriver || !state.drivers[state.tgDriver]) {
      state.tgDriver = state.driverOrder.length ? state.driverOrder[0].driver_number : parseInt(ids[0]);
    }
    var grid = document.getElementById("tgDriverGrid");
    grid.innerHTML = ids.map(id => `<button class="tg-drv" data-dn="${id}">${state.drivers[id].acronym}</button>`).join("");
    grid.onclick = function(e) {
      var b = e.target.closest(".tg-drv");
      if (!b) return;
      state.tgDriver = parseInt(b.dataset.dn);
      updateTGGrid();
      renderTrackGaps();
    };
    updateTGGrid();
    renderTrackGaps();
  }

  function updateTGGrid() {
    document.querySelectorAll("#tgDriverGrid .tg-drv").forEach(b => b.classList.toggle("active", parseInt(b.dataset.dn) === state.tgDriver));
  }

  function renderTrackGaps() {
    try { renderTrackGapsInner(); }
    catch (e) { console.error("Track gaps render failed:", e); }
  }

  function tgRoundRect(ctx, x, y, w, h, rad) {
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  // Time spans [start, end] where a car is off the racing line (pit lane). Cached per car.
  function getPitSegments(dn) {
    var car = state.drivers[dn];
    if (car._pitSegs) return car._pitSegs;
    if (!state.outline || !state.outline.points[0][2]) return [];
    var segs = [], start = null, lastSample = -1e9, data = car.data;
    for (var i = 0; i < data.length; i++) {
      var p = data[i];
      if (p[0] - lastSample < 1) continue;
      if (p[1] === 0 && p[2] === 0) continue;
      lastSample = p[0];
      var inP = getTrackPosition(p[1], p[2]).dist > PIT_THRESHOLD;
      if (inP && start === null) start = p[0];
      else if (!inP && start !== null) { segs.push([start, p[0]]); start = null; }
    }
    if (start !== null) segs.push([start, Infinity]);
    car._pitSegs = segs;
    return segs;
  }

  function tgLerpAng(a, b, k) {
    var d = b - a;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    return a + d * k;
  }

  // Fake pit-lane motion: slide in, sit still, then roll towards the 10s mark. u is 0..1 through the stop.
  function tgPitFrac(u) {
    u = Math.max(0, Math.min(1, u));
    var stopAt = 0.12;
    if (u < 0.2) { var k = u / 0.2; return stopAt * (1 - (1 - k) * (1 - k)); }
    if (u < 0.7) return stopAt;
    var k2 = (u - 0.7) / 0.3;
    return stopAt + (1 - stopAt) * k2 * k2;
  }

  function renderTrackGapsInner() {
    if (!document.getElementById("trackGapsOverlay").classList.contains("open")) return;
    var dn = state.tgDriver;
    if (!dn || !state.drivers[dn]) return;

    var canvas = els.trackGapsCanvas;
    var ctx = canvas.getContext("2d");
    var wrap = canvas.parentElement;
    var dpr = window.devicePixelRatio || 1;
    var w = wrap.clientWidth, h = wrap.clientHeight;
    if (w === 0 || h === 0) return;

    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.36;
    var TAU = Math.PI * 2, T = state.currentTime;
    
    var basePitLoss = parseFloat(els.manualPitLoss.value) || 22.0;
    var pitLoss = basePitLoss;
    
    if (state.tgCondition === 'sc') pitLoss = 12.0;
    if (state.tgCondition === 'vsc') pitLoss = 15.0;

    var status = getTrackStatus(state.currentTime);
    
    // Ring
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.lineWidth = 4; ctx.strokeStyle = "#333"; ctx.stroke();

    var maxT = state.outline.lap_duration;
    [10, 20, 30, 40].forEach(sec => {
      if (sec > maxT) return;
      var angle = (sec / maxT) * Math.PI * 2 - (Math.PI/2);
      var x1 = cx + Math.cos(angle) * (r - 6), y1 = cy + Math.sin(angle) * (r - 6);
      var x2 = cx + Math.cos(angle) * (r + 6), y2 = cy + Math.sin(angle) * (r + 6);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.lineWidth = 2; ctx.strokeStyle = "#888"; ctx.stroke();
      
      ctx.fillStyle = "#888"; ctx.font = "12px 'Noto Sans Mono', monospace"; ctx.textAlign = "center";
      var tx = cx + Math.cos(angle) * (r + 24), ty = cy + Math.sin(angle) * (r + 24);
      ctx.fillText(sec + "s", tx, ty);
    });

    // Pit lane arch: 12 o'clock to the 10s mark, just inside the ring
    var a0 = -Math.PI / 2, a1 = (10 / maxT) * TAU - Math.PI / 2, rp = r * 0.78;
    ctx.beginPath(); ctx.arc(cx, cy, rp, a0, a1);
    ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.strokeStyle = "#262626"; ctx.stroke(); ctx.lineCap = "butt";
    [a0, a1].forEach(a => {
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * rp, cy + Math.sin(a) * rp);
      ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      ctx.lineWidth = 2; ctx.strokeStyle = "#262626"; ctx.stroke();
    });
    ctx.fillStyle = "#666"; ctx.font = "10px 'Noto Sans Mono', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    var am = (a0 + a1) / 2;
    ctx.fillText("PIT", cx + Math.cos(am) * (rp - 18), cy + Math.sin(am) * (rp - 18));

    // Gather cars: on track (t, angle) and in the pit (stop progress)
    var maxLapDone = 0;
    state.laps.forEach(l => { if (T >= l._t_end && l.lap_number > maxLapDone) maxLapDone = l.lap_number; });
    var BL = 2; // seconds of session time used to blend between pit arch and track
    var cars = [], pitCars = [];
    for (var d in state.drivers) {
      var dnum = parseInt(d);
      var loc = getCarLocation(state.drivers[d].data, T);
      if (!loc) continue;
      var pos = getTrackPosition(loc[0], loc[1]);
      var segs = getPitSegments(dnum);
      var done = state.laps.filter(l => l.driver_number == d && l._t_start !== null && T >= l._t_end).length;
      if (isStuck(dnum, maxLapDone - done)) continue;   // stopped for 3+ laps
      if (pos.dist > PIT_THRESHOLD) {
        var seg = null;
        for (var si = 0; si < segs.length; si++) if (T >= segs[si][0] && T <= segs[si][1]) { seg = segs[si]; break; }
        var u = 0.5, startT = T;
        if (seg) {
          startT = seg[0];
          u = isFinite(seg[1]) ? (T - seg[0]) / Math.max(0.1, seg[1] - seg[0]) : Math.min(1, (T - seg[0]) / 25);
        }
        pitCars.push({ dn: dnum, u: u, startT: startT });
      } else {
        var c = { dn: dnum, t: pos.t, ang: (pos.t / maxT) * TAU - Math.PI / 2, rad: r };
        for (var sj = 0; sj < segs.length; sj++) {
          var sg = segs[sj];
          if (T >= sg[1] && T - sg[1] < BL) {            // just left the pit: arch end -> track
            var k = (T - sg[1]) / BL;
            c.ang = tgLerpAng(a1, c.ang, k); c.rad = rp + (r - rp) * k;
          } else if (T < sg[0] && sg[0] - T < BL) {      // about to enter: track -> arch start
            var k2 = 1 - (sg[0] - T) / BL;
            c.ang = tgLerpAng(c.ang, a0, k2); c.rad = r + (rp - r) * k2;
          }
        }
        cars.push(c);
      }
    }

    pitCars.sort((x, y) => (x.startT - y.startT) || (x.dn - y.dn));
    pitCars.forEach((pc, i) => {
      var f = tgPitFrac(pc.u);
      var off = (i % 2 ? -1 : 1) * Math.ceil(i / 2) * 10;
      pc.ang = a0 + (a1 - a0) * f; pc.rad = rp + off;
      pc.t = null;
    });

    var selCar = cars.find(x => x.dn === dn) || null;
    var selPit = pitCars.find(x => x.dn === dn) || null;
    var selData = selCar;   // on-track selected car (null while pitting)

    // Rejoin marker: you lose pitLoss seconds, so you come out BEHIND where you are now
    var rejoinT = null;
    if (selData) {
      rejoinT = selData.t - pitLoss;
      if (rejoinT < 0) rejoinT += maxT;
      var rejoinAngle = (rejoinT / maxT) * Math.PI * 2 - (Math.PI/2);
      var rx = cx + Math.cos(rejoinAngle) * r, ry = cy + Math.sin(rejoinAngle) * r;
      
      ctx.beginPath(); ctx.arc(rx, ry, 8, 0, Math.PI * 2);
      ctx.setLineDash([4, 4]); ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke(); ctx.setLineDash([]);
      
      ctx.fillStyle = "#fff"; ctx.font = "12px 'Noto Sans Mono', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("rejoin", cx + Math.cos(rejoinAngle) * (r - 26), cy + Math.sin(rejoinAngle) * (r - 26));
    }

    // Which cars get a label: selected, plus the few nearest the selected car and the rejoin spot
    function cdiff(a, b) { var x = (((a - b) % maxT) + maxT) % maxT; return x > maxT / 2 ? x - maxT : x; }
    var labelled = {};
    function pickNear(anchorT) {
      cars.filter(c => c.dn !== dn && Math.abs(cdiff(c.t, anchorT)) <= 7)
          .sort((p, q) => Math.abs(cdiff(p.t, anchorT)) - Math.abs(cdiff(q.t, anchorT)))
          .slice(0, 4).forEach(c => { labelled[c.dn] = true; });
    }
    if (selData) { pickNear(selData.t); pickNear(rejoinT); }
    else if (selPit) { pickNear(10); }

    var all = cars.concat(pitCars);
    all.forEach(c => { c.x = cx + Math.cos(c.ang) * c.rad; c.y = cy + Math.sin(c.ang) * c.rad; });

    // Dots: plain first, then labelled, selected on top
    function dot(c, rad, ring) {
      ctx.beginPath(); ctx.arc(c.x, c.y, rad, 0, Math.PI * 2);
      ctx.fillStyle = "#" + state.drivers[c.dn].color; ctx.fill();
      if (ring) { ctx.lineWidth = ring; ctx.strokeStyle = "#fff"; ctx.stroke(); }
    }
    all.filter(c => c.dn !== dn && !labelled[c.dn]).forEach(c => dot(c, 4.5, 0));
    all.filter(c => c.dn !== dn && labelled[c.dn]).forEach(c => dot(c, 6, 1.5));
    var selAny = selData || selPit;
    if (selAny) dot(selAny, 8, 2);

    // Labels, placed outward from the dot, pushed further out if they would overlap
    var placed = [];
    function label(c) {
      var car = state.drivers[c.dn], isSel = c.dn === dn;
      var text = car.acronym;
      if (!isSel && selData && c.t !== null) {
        var g = cdiff(c.t, selData.t);
        text += " " + (g > 0 ? "+" : "") + g.toFixed(1);
      }
      ctx.font = "bold 12px 'Noto Sans Mono', monospace";
      var bw = ctx.measureText(text).width + 12, bh = 18, dist = 26, lx = c.x, ly = c.y;
      for (var tries = 0; tries < 8; tries++) {
        lx = c.x + Math.cos(c.ang) * dist; ly = c.y + Math.sin(c.ang) * dist;
        lx = Math.max(bw / 2 + 2, Math.min(w - bw / 2 - 2, lx));
        ly = Math.max(bh / 2 + 2, Math.min(h - bh / 2 - 2, ly));
        var hit = placed.some(p => Math.abs(p.x - lx) < (p.w + bw) / 2 + 2 && Math.abs(p.y - ly) < (p.h + bh) / 2 + 2);
        if (!hit) break;
        dist += 14;
      }
      placed.push({ x: lx, y: ly, w: bw, h: bh });

      ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(lx, ly);
      ctx.lineWidth = 1; ctx.strokeStyle = "#555"; ctx.stroke();

      ctx.fillStyle = isSel ? "#fff" : "rgba(0,0,0,0.85)";
      ctx.strokeStyle = isSel ? "#fff" : "#444";
      ctx.beginPath(); tgRoundRect(ctx, lx - bw / 2, ly - bh / 2, bw, bh, 9);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = isSel ? "#000" : "#fff";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(text, lx, ly + 1);
    }
    if (selAny) label(selAny);
    all.filter(c => c.dn !== dn && labelled[c.dn])
       .sort((p, q) => Math.abs(cdiff(p.t, selData ? selData.t : 10)) - Math.abs(cdiff(q.t, selData ? selData.t : 10)))
       .forEach(label);

    var leaderLaps = 1;
    var lapCounts = {};
    state.laps.forEach(l => {
      var lt = l._t_start;
      if (state.currentTime >= lt && l.lap_number > (lapCounts[l.driver_number]||0)) lapCounts[l.driver_number] = l.lap_number;
    });
    for (var d in lapCounts) if (lapCounts[d] > leaderLaps) leaderLaps = lapCounts[d];
    
    ctx.fillStyle = "#fff"; ctx.font = "bold 36px 'Noto Sans Mono', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(leaderLaps + "/" + (state.sessionResult.length > 0 ? state.sessionResult[0].number_of_laps : "58"), cx, cy - 10);
    
    ctx.fillStyle = "#888"; ctx.font = "16px 'Noto Sans Mono', monospace";
    ctx.fillText(status, cx, cy + 20);
  }

  // --- RC OVERLAY LOGIC ---
  function renderRCOverlay() {
    var t = state.currentTime;
    var pastRC = state.raceControl.filter(m => (new Date(m.date).getTime() - state.sessionStartMs)/1000 <= t);
    
    var last5 = pastRC.slice(-5).reverse();
    var penalties = pastRC.filter(m => m.message && (m.message.includes("PENALTY") || m.message.includes("INVESTIGATION") || m.message.includes("NOTED"))).slice(-10).reverse();
    
    var blackFlags = {};
    pastRC.forEach(m => {
      if (m.message && (m.message.includes("BLACK FLAG") || m.message.includes("DISQUALIFIED"))) {
        if (m.driver_number) {
          blackFlags[m.driver_number] = (blackFlags[m.driver_number] || 0) + 1;
        }
      }
    });
    
    var html = `<div class="rc-section-title">Last 5 Messages</div>`;
    if (last5.length === 0) html += `<div class="rc-text" style="color:#666; margin-bottom:16px;">No messages yet.</div>`;
    else {
      last5.forEach(m => {
        var time = new Date(m.date).toTimeString().slice(0, 8);
        html += `<div class="rc-row"><span class="rc-time">${time}</span><span class="rc-text">${m.message}</span></div>`;
      });
    }

    html += `<div class="rc-section-title">Penalties & Investigations</div>`;
    if (penalties.length === 0) html += `<div class="rc-text" style="color:#666; margin-bottom:16px;">None.</div>`;
    else {
      penalties.forEach(m => {
        var time = new Date(m.date).toTimeString().slice(0, 8);
        html += `<div class="rc-row"><span class="rc-time">${time}</span><span class="rc-text">${m.message}</span></div>`;
      });
    }
    
    var bfHtml = "";
    for (var dn in blackFlags) {
      var drv = state.drivers[dn];
      if (drv) bfHtml += `<div style="font-size: 15px; margin-bottom: 8px;">${drv.acronym} (Car ${dn}): <span style="color:var(--err); font-weight:700;">${blackFlags[dn]} Black Flags</span></div>`;
    }
    if (bfHtml) {
      html += `<div class="rc-section-title">Black Flags</div>`;
      html += bfHtml;
    }

    document.getElementById("rcResults").innerHTML = html;
  }

  els.slider.addEventListener("input", () => {
    if (document.getElementById('trackGapsOverlay').classList.contains('open')) renderTrackGaps();
  });

})();
</script>
