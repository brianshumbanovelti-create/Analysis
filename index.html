  });

  function handleCanvasClick(e) {
    if (!state.transform || els.mapEmpty.style.display !== "none") return;
    var rect = els.canvas.getBoundingClientRect(), tx = e.clientX - rect.left, ty = e.clientY - rect.top - 48;
    if (ty < 0) return;
    
    var hitDn = null;
    var t = state.transform;
    for (var i = Object.keys(state.drivers).length - 1; i >= 0; i--) {
      var dn = Object.keys(state.drivers)[i], loc = getCarLocation(state.drivers[dn].data, state.currentTime);
      if (!loc) continue;
      var cx = (loc[0] - t.minX) * t.scale + t.offsetX, cy = (loc[1] - t.minY) * t.scale + t.offsetY;
      if (Math.sqrt(Math.pow(tx - cx, 2) + Math.pow(ty - cy, 2)) < 22) { hitDn = parseInt(dn, 10); break; }
    }
    
    if (hitDn) {
      var now = Date.now();
      if (now - lastTapTime < 300 && lastTapTarget === hitDn) { toggleHighlight(hitDn); lastTapTime = 0; }
      else { lastTapTime = now; lastTapTarget = hitDn; }
    }
  }

  els.canvas.addEventListener("click", handleCanvasClick);

  function prepareBackground() {
    if (!state.outline) return;
    var wrap = els.mapWrap, dpr = window.devicePixelRatio || 1, cssW = wrap.clientWidth, cssH = wrap.clientHeight - 48;
    if (cssW === 0 || cssH === 0) return;
    els.canvas.width = Math.round(cssW * dpr); els.canvas.height = Math.round(cssH * dpr);
    baseCanvas.width = els.canvas.width; baseCanvas.height = els.canvas.height;
    baseCtx.setTransform(dpr, 0, 0, dpr, 0, 0); baseCtx.clearRect(0, 0, cssW, cssH);
    
    var pts = state.outline.points, minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    pts.forEach(p => { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); });
    var w = maxX - minX, h = maxY - minY;
    if (w <= 0 || h <= 0) return;

    var pad = 20, availW = cssW - pad * 2, availH = cssH - pad * 2;
    var scale = Math.min(availW / w, availH / h), offsetX = pad + (availW - w * scale) / 2, offsetY = pad + (availH - h * scale) / 2;
    state.transform = { minX, minY, scale, offsetX, offsetY, cssW, cssH };

    function toCanvas(px, py) {
      var cx = (px - minX) * scale + offsetX, cy = (py - minY) * scale + offsetY;
      return [cx, cy];
    }

    var trackStatus = getTrackStatus(state.currentTime);
    var strokeColor = trackStatus === "Red" ? "#ff5c5c" : trackStatus === "SC" ? "var(--yellow)" : trackStatus === "VSC" ? "var(--amber)" : "#2a3454";

    baseCtx.beginPath();
    var p0 = toCanvas(pts[0][0], pts[0][1]); baseCtx.moveTo(p0[0], p0[1]);
    for (var j = 1; j < pts.length; j++) { var c = toCanvas(pts[j][0], pts[j][1]); baseCtx.lineTo(c[0], c[1]); }
    baseCtx.closePath();
    baseCtx.lineWidth = 4; baseCtx.lineJoin = "round";
    baseCtx.strokeStyle = strokeColor;
    baseCtx.stroke();

    var p1 = toCanvas(pts[1][0], pts[1][1]);
    var dx = p1[0] - p0[0], dy = p1[1] - p0[1], len = Math.sqrt(dx*dx + dy*dy);
    var nx = -dy / len, ny = dx / len, lineLen = 12;
    baseCtx.beginPath(); baseCtx.moveTo(p0[0] - nx * lineLen, p0[1] - ny * lineLen);
    baseCtx.lineTo(p0[0] + nx * lineLen, p0[1] + ny * lineLen);
    baseCtx.lineWidth = 3; baseCtx.strokeStyle = "#ffffff"; baseCtx.stroke();

    var validLaps = state.laps.filter(l => l.date_start && !l.is_pit_out_lap && l.duration_sector_1 && l.duration_sector_2 && l.duration_sector_3);
    if (validLaps.length > 0) {
      var fastest = validLaps.reduce((a, b) => a.lap_duration < b.lap_duration ? a : b);
      var startMs = new Date(fastest.date_start).getTime();
      var s1Ms = startMs + (fastest.duration_sector_1 * 1000);
      var s2Ms = s1Ms + (fastest.duration_sector_2 * 1000);
      var refData = state.drivers[fastest.driver_number] ? state.drivers[fastest.driver_number].data : [];
      
      function findCoord(targetMs) {
        var targetT = (targetMs - state.sessionStartMs) / 1000;
        for (var i = 0; i < refData.length - 1; i++) {
          if (refData[i][0] <= targetT && refData[i+1][0] >= targetT) {
            var ratio = (targetT - refData[i][0]) / (refData[i+1][0] - refData[i][0]);
            return [refData[i][1] + (refData[i+1][1] - refData[i][1]) * ratio, refData[i][2] + (refData[i+1][2] - refData[i][2]) * ratio];
          }
        }
        return null;
      }
      
      [s1Ms, s2Ms].forEach(tgtMs => {
        var coord = findCoord(tgtMs);
        if (coord) {
          var c = toCanvas(coord[0], coord[1]);
          baseCtx.beginPath(); baseCtx.moveTo(c[0] - nx * 8, c[1] - ny * 8); baseCtx.lineTo(c[0] + nx * 8, c[1] + ny * 8);
          baseCtx.lineWidth = 2; baseCtx.strokeStyle = "rgba(255,255,255,0.4)"; baseCtx.stroke();
        }
      });
    }
  }

  function drawCars() {
    if (!state.outline || !state.transform) return;
    var ctx = els.canvas.getContext("2d"), t = state.transform;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, els.canvas.width, els.canvas.height);
    ctx.drawImage(baseCanvas, 0, 0);
    ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
    
    var trackStatus = getTrackStatus(state.currentTime);
    
    for (var dn in state.drivers) {
      var car = state.drivers[dn], loc = getCarLocation(car.data, state.currentTime);
      if (!loc) continue;
      
      var cx = (loc[0] - t.minX) * t.scale + t.offsetX, cy = (loc[1] - t.minY) * t.scale + t.offsetY;

      if (state.highlightedDriver === parseInt(dn, 10)) {
        ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI * 2); ctx.fillStyle = "#" + car.color; ctx.globalAlpha = 0.3; ctx.fill(); ctx.globalAlpha = 1.0;
      }
      ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fillStyle = "#" + car.color; ctx.fill();
      ctx.fillStyle = getContrastColor(car.color); ctx.font = "bold 11px 'Noto Sans Mono', monospace";
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(dn, cx, cy);
    }
  }

  function getCarLocation(data, t) {
    if (data.length === 0) return null;
    if (t > data[data.length - 1][0]) {
      var last = data[data.length - 1];
      return (last[1] === 0 && last[2] === 0) ? null : [last[1], last[2]];
    }
    if (t < data[0][0]) return null;

    var i = data.length - 1;
    while (i > 0 && data[i][0] > t) i--;
    if (i === data.length - 1) return [data[i][1], data[i][2]];
    
    var p1 = data[i], p2 = data[i + 1];
    if (p2[0] - p1[0] > 5) return [p1[1], p1[2]];

    var ratio = (t - p1[0]) / (p2[0] - p1[0]);
    var x = p1[1] + (p2[1] - p1[1]) * ratio, y = p1[2] + (p2[2] - p1[2]) * ratio;
    if (x === 0 && y === 0) return null;
    return [x, y];
  }

  function getTrackPosition(x, y) {
    if (!state.outline || !state.outline.points[0][2]) return { dist: 9999, t: 0 };
    var pts = state.outline.points;
    var minDist = Infinity, bestT = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var x1 = pts[i][0], y1 = pts[i][1], t1 = pts[i][2];
      var x2 = pts[i+1][0], y2 = pts[i+1][1], t2 = pts[i+1][2];
      
      var dx = x2 - x1, dy = y2 - y1;
      var lenSq = dx*dx + dy*dy;
      if (lenSq === 0) continue;
      
      var u = ((x - x1) * dx + (y - y1) * dy) / lenSq;
      u = Math.max(0, Math.min(1, u));
      
      var px = x1 + u * dx, py = y1 + u * dy;
      var dist = Math.sqrt(Math.pow(x - px, 2) + Math.pow(y - py, 2));
      
      if (dist < minDist) {
        minDist = dist;
        bestT = t1 + u * (t2 - t1);
      }
    }
    return { dist: minDist, t: bestT };
  }

  function loop(timestamp) {
    if (!state.playing) return;
    if (!state.lastFrameTime) state.lastFrameTime = timestamp;
    var dt = (timestamp - state.lastFrameTime) / 1000; state.lastFrameTime = timestamp; state.currentTime += dt;
    if (state.currentTime >= state.sessionLength) { state.currentTime = state.sessionLength; pausePlayback(); }
    
    updateTimeDisplay();
    var currentFlagState = getTrackStatus(state.currentTime);
    if (state.lastFlagState !== currentFlagState) {
      state.lastFlagState = currentFlagState;
      prepareBackground();
    }
    drawCars(); updateRankings();
    
    if (els.driverModal.classList.contains('open')) renderModalBody();
    
    if (state.playing) animationId = requestAnimationFrame(loop);
  }
  
  function playPlayback() { 
    if (state.playing) return; 
    if (state.currentTime >= state.sessionLength) state.currentTime = 0; 
    state.playing = true; 
    state.lastFrameTime = 0; 
    els.playBtn.textContent = "⏸"; 
    animationId = requestAnimationFrame(loop); 
  }
  
  function pausePlayback() { 
    state.playing = false; 
    els.playBtn.textContent = "▶"; 
    if (animationId) cancelAnimationFrame(animationId); 
  }
  
  els.playBtn.addEventListener("click", () => { if (state.playing) pausePlayback(); else playPlayback(); });
  var wasPlaying = false;
  els.slider.addEventListener("input", () => {
    state.currentTime = parseFloat(els.slider.value);
    updateTimeDisplay();
    var currentFlagState = getTrackStatus(state.currentTime);
    if (state.lastFlagState !== currentFlagState) {
      state.lastFlagState = currentFlagState;
      prepareBackground();
    }
    drawCars(); updateRankings();
    if (els.driverModal.classList.contains('open')) renderModalBody();
  });
  els.slider.addEventListener("touchstart", () => { wasPlaying = state.playing; pausePlayback(); });
  els.slider.addEventListener("touchend", () => { if (wasPlaying) playPlayback(); });
  
  els.flipBtn.addEventListener("click", () => { 
    state.flipX = !state.flipX; 
    prepareBackground(); 
    drawCars(); 
  });
  
  els.rotateBtn.addEventListener("click", () => { 
    state.rotation = (state.rotation + 90) % 360; 
    prepareBackground(); 
    drawCars(); 
  });
  
  els.rcBtn.addEventListener("click", window.openRCOverlay);
  
  window.addEventListener("resize", () => { if (resizeTimer) clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { prepareBackground(); drawCars(); renderTrackGaps(); }, 100); });
  window.addEventListener("orientationchange", () => { if (resizeTimer) clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { prepareBackground(); drawCars(); renderTrackGaps(); }, 100); });

  // --- ANALYSIS TAB LOGIC ---
  function initAnalysis() {
    var d1 = document.getElementById("analysisDriver1");
    var d2 = document.getElementById("analysisDriver2");
    if (!d1 || !d2) return; 

    var opts = state.driverOrder.map(d => `<option value="${d.driver_number}">${state.drivers[d.driver_number].acronym}</option>`).join("");
    d1.innerHTML = opts;
    d2.innerHTML = opts;
    if (state.driverOrder.length > 1) d2.selectedIndex = 1;
    
    d1.onchange = renderAnalysis;
    d2.onchange = renderAnalysis;
    renderAnalysis();
  }

  function renderAnalysis() {
    var dn1 = parseInt(document.getElementById("analysisDriver1").value);
    var dn2 = parseInt(document.getElementById("analysisDriver2").value);
    if (!dn1 || !dn2 || dn1 === dn2) {
      document.getElementById("analysisResults").innerHTML = `<div style="text-align:center; padding:20px; color:#888">Select two different drivers.</div>`;
      return;
    }

    var currentT = state.currentTime;
    var laps1 = state.laps.filter(l => l.driver_number === dn1 && l.lap_duration && l._t_end <= currentT).sort((a,b) => a.lap_number - b.lap_number);
    var laps2 = state.laps.filter(l => l.driver_number === dn2 && l.lap_duration && l._t_end <= currentT).sort((a,b) => a.lap_number - b.lap_number);
    
    var maxLap = Math.max(laps1.length > 0 ? laps1[laps1.length-1].lap_number : 0, laps2.length > 0 ? laps2[laps2.length-1].lap_number : 0);
    
    var d1Color = "#" + state.drivers[dn1].color;
    var d2Color = "#" + state.drivers[dn2].color;
    
    document.getElementById("analysisSummary").innerHTML = `${state.drivers[dn1].acronym} vs ${state.drivers[dn2].acronym}`;

    var html = `<div class="analysis-header-row"><span>Lap</span><span>${state.drivers[dn1].acronym}</span><span>Gap</span><span>${state.drivers[dn2].acronym}</span></div>`;

    for (var i = 1; i <= maxLap; i++) {
      var l1 = laps1.find(l => l.lap_number === i);
      var l2 = laps2.find(l => l.lap_number === i);
      
      if (!l1 && !l2) continue;

      var t1Str = l1 ? formatTime(l1.lap_duration) : "-";
      var t2Str = l2 ? formatTime(l2.lap_duration) : "-";
      var t1Cls = l1 && l2 && l1.lap_duration <= l2.lap_duration ? "fastest" : "";
      var t2Cls = l2 && l1 && l2.lap_duration < l1.lap_duration ? "fastest" : "";

      var deltaStr = "";
      var deltaColor = "#fff";
      var d1Width = 0, d2Width = 0;
      var s1w = 0, s2w = 0, s3w = 0;
      
      if (l1 && l2) {
        var d = l1.lap_duration - l2.lap_duration;
        deltaStr = Math.abs(d).toFixed(2);
        deltaColor = d < 0 ? d1Color : d2Color;
        var maxD = 2.0;
        var pct = Math.min(1, Math.abs(d) / maxD) * 50;
        if (d < 0) d1Width = pct; else d2Width = pct;

        function sectorW(s1, s2) { if (!s1 || !s2) return 0; return Math.min(1, Math.abs(s1-s2)/0.5)*50; }
        s1w = sectorW(l1.duration_sector_1, l2.duration_sector_1);
        s2w = sectorW(l1.duration_sector_2, l2.duration_sector_2);
        s3w = sectorW(l1.duration_sector_3, l2.duration_sector_3);
      }

      html += `<div class="analysis-row">
        <div class="analysis-top-line">
          <div class="analysis-time-wrap left">
            <span class="analysis-lap-num">${i}</span>
            <span class="analysis-time ${t1Cls}">${t1Str}</span>
          </div>
          <div class="analysis-center-bar">
            <div class="analysis-delta" style="color:${deltaColor}">${deltaStr}</div>
            <div class="analysis-track">
              <div class="analysis-tick"></div>
              <div style="position:absolute; right:50%; height:100%; background:${d1Color}; width:${d1Width}%"></div>
              <div style="position:absolute; left:50%; height:100%; background:${d2Color}; width:${d2Width}%"></div>
            </div>
          </div>
          <div class="analysis-time-wrap right">
            <span class="analysis-lap-num">&nbsp;</span>
            <span class="analysis-time ${t2Cls}">${t2Str}</span>
          </div>
        </div>
        <div class="analysis-sector-row">
          <div class="analysis-sector-block left">
            <div class="sector-bar" style="background:${l1?.duration_sector_3 < l2?.duration_sector_3 ? d1Color : '#333'}; margin-left:${l1?.duration_sector_3 < l2?.duration_sector_3 ? 0 : 100-s3w}%; width:${s3w}%"></div>
            <div class="sector-bar" style="background:${l1?.duration_sector_2 < l2?.duration_sector_2 ? d1Color : '#333'}; margin-left:${l1?.duration_sector_2 < l2?.duration_sector_2 ? 0 : 100-s2w}%; width:${s2w}%"></div>
            <div class="sector-bar" style="background:${l1?.duration_sector_1 < l2?.duration_sector_1 ? d1Color : '#333'}; margin-left:${l1?.duration_sector_1 < l2?.duration_sector_1 ? 0 : 100-s1w}%; width:${s1w}%"></div>
          </div>
          <div class="analysis-sector-block right">
            <div class="sector-bar" style="background:${l2?.duration_sector_1 < l1?.duration_sector_1 ? d2Color : '#333'}; width:${s1w}%"></div>
            <div class="sector-bar" style="background:${l2?.duration_sector_2 < l1?.duration_sector_2 ? d2Color : '#333'}; width:${s2w}%"></div>
            <div class="sector-bar" style="background:${l2?.duration_sector_3 < l1?.duration_sector_3 ? d2Color : '#333'}; width:${s3w}%"></div>
          </div>
        </div>
      </div>`;
    }
    
    // Sector Breakdown for the latest completed lap
    var latestL1 = laps1[laps1.length-1];
    var latestL2 = laps2[laps2.length-1];
    if (latestL1 && latestL2) {
      function cS(s1, s2, c1, c2) { if(!s1||!s2) return ""; return s1<s2 ? "color:"+c1 : s2<s1 ? "color:"+c2 : ""; }
      html += `<div class="analysis-detail-row"><span></span><span style="color:#888">${state.drivers[dn1].acronym}</span><span style="color:#888; text-align:right">${state.drivers[dn2].acronym}</span></div>`;
      html += `<div class="analysis-detail-row"><span>S1</span><span style="${cS(latestL1.duration_sector_1, latestL2.duration_sector_1, d1Color, d2Color)}">${latestL1.duration_sector_1?.toFixed(2)}</span><span style="text-align:right; ${cS(latestL1.duration_sector_1, latestL2.duration_sector_1, d2Color, d1Color)}">${latestL2.duration_sector_1?.toFixed(2)}</span></div>`;
      html += `<div class="analysis-detail-row"><span>S2</span><span style="${cS(latestL1.duration_sector_2, latestL2.duration_sector_2, d1Color, d2Color)}">${latestL1.duration_sector_2?.toFixed(2)}</span><span style="text-align:right; ${cS(latestL1.duration_sector_2, latestL2.duration_sector_2, d2Color, d1Color)}">${latestL2.duration_sector_2?.toFixed(2)}</span></div>`;
      html += `<div class="analysis-detail-row"><span>S3</span><span style="${cS(latestL1.duration_sector_3, latestL2.duration_sector_3, d1Color, d2Color)}">${latestL1.duration_sector_3?.toFixed(2)}</span><span style="text-align:right; ${cS(latestL1.duration_sector_3, latestL2.duration_sector_3, d2Color, d1Color)}">${latestL2.duration_sector_3?.toFixed(2)}</span></div>`;
    }

    document.getElementById("analysisResults").innerHTML = html;
  }

  // --- TRACK GAPS (CIRCLE OF DOOM) REDESIGN ---
  function initTrackGaps() {
    var sel = document.getElementById("tgDriverSelect");
    var opts = state.driverOrder.map(d => `<option value="${d.driver_number}">${state.drivers[d.driver_number].acronym}</option>`).join("");
    sel.innerHTML = opts;
    if (state.driverOrder.length > 0) sel.selectedIndex = 0;
    sel.onchange = renderTrackGaps;
    renderTrackGaps();
  }

  function renderTrackGaps() {
    if (!document.getElementById("trackGapsOverlay").classList.contains("open")) return;
    var dn = parseInt(document.getElementById("tgDriverSelect").value);
    if (!dn) return;

    var canvas = els.trackGapsCanvas;
    var ctx = canvas.getContext("2d");
    var wrap = canvas.parentElement;
    var dpr = window.devicePixelRatio || 1;
    var w = wrap.clientWidth, h = wrap.clientHeight;
    if (w === 0 || h === 0) return;

    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.4;
    
    // Determine Pit Loss based on condition
    var pitLoss = state.medianPitLoss;
    if (state.tgCondition === 'sc') pitLoss = state.scPitLoss;
    if (state.tgCondition === 'vsc') pitLoss = state.vscPitLoss;

    var status = getTrackStatus(state.currentTime);
    
    // Ring
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.lineWidth = 4; ctx.strokeStyle = "#333"; ctx.stroke();

    // Ticks (10s, 20s, 30s, 40s)
    var maxT = state.outline.lap_duration;
    [10, 20, 30, 40].forEach(sec => {
      if (sec > maxT) return;
      var angle = (sec / maxT) * Math.PI * 2 - (Math.PI/2);
      var x1 = cx + Math.cos(angle) * (r - 6), y1 = cy + Math.sin(angle) * (r - 6);
      var x2 = cx + Math.cos(angle) * (r + 6), y2 = cy + Math.sin(angle) * (r + 6);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.lineWidth = 2; ctx.strokeStyle = "#888"; ctx.stroke();
      
      ctx.fillStyle = "#888"; ctx.font = "12px 'Noto Sans Mono', monospace"; ctx.textAlign = "center";
      var tx = cx + Math.cos(angle) * (r + 24), ty = cy + Math.sin(angle) * (r + 24);
      ctx.fillText(sec + "s", tx, ty);
    });

    var driversData = [];
    for (var d in state.drivers) {
      var loc = getCarLocation(state.drivers[d].data, state.currentTime);
      if (!loc) continue;
      var pos = getTrackPosition(loc[0], loc[1]);
      if (pos.dist > PIT_THRESHOLD) continue; // Ignore pit lane
      driversData.push({ dn: parseInt(d), t: pos.t });
    }

    // Sort by track position
    driversData.sort((a, b) => a.t - b.t);
    var selIdx = driversData.findIndex(x => x.dn === dn);
    if (selIdx === -1) return;
    
    var selData = driversData[selIdx];

    // Draw Rejoin Marker
    var rejoinT = selData.t + pitLoss;
    if (rejoinT > maxT) rejoinT -= maxT;
    var rejoinAngle = (rejoinT / maxT) * Math.PI * 2 - (Math.PI/2);
    var rx = cx + Math.cos(rejoinAngle) * r, ry = cy + Math.sin(rejoinAngle) * r;
    
    ctx.beginPath(); ctx.arc(rx, ry, 8, 0, Math.PI * 2);
    ctx.setLineDash([4, 4]); ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke(); ctx.setLineDash([]);
    
    ctx.fillStyle = "#fff"; ctx.textAlign = "left";
    ctx.fillText("rejoin", rx + 12, ry + 4);

    // Draw Cars & Chips
    driversData.forEach(d => {
      var car = state.drivers[d.dn];
      var angle = (d.t / maxT) * Math.PI * 2 - (Math.PI/2);
      var x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
      
      ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#" + car.color; ctx.fill();
      
      // Calculate gap to selected driver
      var gapT = d.t - selData.t;
      if (gapT > maxT/2) gapT -= maxT;
      if (gapT < -maxT/2) gapT += maxT;
      
      var text = car.acronym + (d.dn === dn ? "" : " " + (gapT > 0 ? "+" : "") + gapT.toFixed(1));
      ctx.font = "bold 12px 'Noto Sans Mono', monospace";
      var tw = ctx.measureText(text).width;
      
      ctx.fillStyle = (d.dn === dn) ? "#fff" : "rgba(0,0,0,0.8)";
      ctx.strokeStyle = (d.dn === dn) ? "#fff" : "#444";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(x - tw/2 - 6, y - 24, tw + 12, 18, 9);
      ctx.fill(); ctx.stroke();
      
      ctx.fillStyle = (d.dn === dn) ? "#000" : "#fff";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(text, x, y - 15);
    });

    // Center Text
    var leaderLaps = 1;
    var lapCounts = {};
    state.laps.forEach(l => {
      var lt = l._t_start;
      if (state.currentTime >= lt && l.lap_number > (lapCounts[l.driver_number]||0)) lapCounts[l.driver_number] = l.lap_number;
    });
    for (var d in lapCounts) if (lapCounts[d] > leaderLaps) leaderLaps = lapCounts[d];
    
    ctx.fillStyle = "#fff"; ctx.font = "bold 36px 'Noto Sans Mono', monospace"; ctx.textAlign = "center";
    ctx.fillText(leaderLaps + "/" + (state.sessionResult.length > 0 ? state.sessionResult[0].number_of_laps : "58"), cx, cy - 10);
    
    ctx.fillStyle = "#888"; ctx.font = "16px 'Noto Sans Mono', monospace";
    ctx.fillText(status, cx, cy + 20);

    // Summary Text
    var rejoinPos = 1;
    driversData.forEach(d => {
      if (d.dn !== dn && d.t > selData.t && d.t < rejoinT) rejoinPos++;
    });
    var carsPassing = [];
    driversData.forEach(d => {
      if (d.dn !== dn && d.t > selData.t && d.t < rejoinT) carsPassing.push(state.drivers[d.dn].acronym);
    });
    
    var summary = state.drivers[dn].acronym + " is P" + (selIdx + 1) + ". Pit under " + state.tgCondition.toUpperCase() + ": rejoin P" + rejoinPos + ".<br>";
    if (carsPassing.length > 0) summary += "Cars that would pass you: " + carsPassing.join(", ") + ".";
    else summary += "You would rejoin in clear air.";
    
    document.getElementById("tgSummary").innerHTML = summary;
  }

  // --- RC OVERLAY LOGIC ---
  function renderRCOverlay() {
    var t = state.currentTime;
    var pastRC = state.raceControl.filter(m => (new Date(m.date).getTime() - state.sessionStartMs)/1000 <= t);
    
    var last5 = pastRC.slice(-5).reverse();
    var penalties = pastRC.filter(m => m.message && (m.message.includes("PENALTY") || m.message.includes("INVESTIGATION") || m.message.includes("NOTED"))).slice(-10).reverse();
    
    var blackFlags = {};
    pastRC.forEach(m => {
      if (m.message && (m.message.includes("BLACK FLAG") || m.message.includes("DISQUALIFIED"))) {
        if (m.driver_number) {
          blackFlags[m.driver_number] = (blackFlags[m.driver_number] || 0) + 1;
        }
      }
    });
    
    var html = `<div class="rc-section-title">Last 5 Messages</div>`;
    if (last5.length === 0) html += `<div class="rc-text" style="color:#666; margin-bottom:16px;">No messages yet.</div>`;
    else {
      last5.forEach(m => {
        var time = new Date(m.date).toTimeString().slice(0, 8);
        html += `<div class="rc-row"><span class="rc-time">${time}</span><span class="rc-text">${m.message}</span></div>`;
      });
    }

    html += `<div class="rc-section-title">Penalties & Investigations</div>`;
    if (penalties.length === 0) html += `<div class="rc-text" style="color:#666; margin-bottom:16px;">None.</div>`;
    else {
      penalties.forEach(m => {
        var time = new Date(m.date).toTimeString().slice(0, 8);
        html += `<div class="rc-row"><span class="rc-time">${time}</span><span class="rc-text">${m.message}</span></div>`;
      });
    }
    
    var bfHtml = "";
    for (var dn in blackFlags) {
      var drv = state.drivers[dn];
      if (drv) bfHtml += `<div style="font-size: 15px; margin-bottom: 8px;">${drv.acronym} (Car ${dn}): <span style="color:var(--err); font-weight:700;">${blackFlags[dn]} Black Flags</span></div>`;
    }
    if (bfHtml) {
      html += `<div class="rc-section-title">Black Flags</div>`;
      html += bfHtml;
    }

    document.getElementById("rcResults").innerHTML = html;
  }

  // Update the loop and slider to also update the Track Gaps overlay if open
  var originalLoop = loop;
  loop = function(ts) {
    originalLoop(ts);
    if (document.getElementById('trackGapsOverlay').classList.contains('open')) renderTrackGaps();
  };

  els.slider.addEventListener("input", () => {
    if (document.getElementById('trackGapsOverlay').classList.contains('open')) renderTrackGaps();
  });

})();
</script>
